<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="login-container">
        <h1>🔐 Login</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email หรือ Username</label>
                <input 
                    type="text" 
                    id="email" 
                    name="email" 
                    placeholder="example@email.com" 
                    required
                >
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="••••••••" 
                    required
                >
                <span class="error-message" id="passwordError"></span>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox" name="remember"> จำข้อมูลของฉัน
                </label>
                <a href="#forgot">ลืม Password?</a>
            </div>

            <button type="submit" class="login-btn">เข้าสู่ระบบ</button>
            <span class="success-message" id="successMessage"></span>
        </form>

        <div class="signup-link">
            ยังไม่มีบัญชี? <a href="#signup">สมัครสมาชิก</a>
        </div>
    </div>

    <script src="scripts/login.js"></script>
</body>
</html>
